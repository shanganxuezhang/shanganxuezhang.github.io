<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1">
<title>江苏大专院校名录 · 江苏专转本</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<style>
  .city { margin-bottom: 18px; }
  .city-head {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 14px; font-weight: 650; margin-bottom: 8px;
  }
  .city-head .n { color: var(--ink-3); font-size: 12px; font-weight: 400; }
  .sch {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border-radius: 10px;
    padding: 10px 13px; margin-bottom: 6px;
    box-shadow: 0 1px 5px rgba(120,92,60,.045);
    font-size: 13.8px;
  }
  .sch .nm { flex: 1; min-width: 0; }
  .nat { font-size: 11px; padding: 1px 7px; border-radius: 5px; flex: none; }
  .nat-pub { background: #E8F3EC; color: #2E7D5B; }
  .nat-priv { background: #FBEAE6; color: #C0392B; }
  .nat-other { background: var(--bg-soft); color: var(--ink-2); }
</style>
</head>
<body>

<div class="topbar">
  <div class="back">‹</div>
  <h1>江苏大专院校</h1>
  <div class="sub" id="cnt"></div>
</div>

<div class="wrap">

  <div class="search">
    <span class="mag">🔍</span>
    <input id="kw" type="search" placeholder="搜院校或城市" autocomplete="off">
  </div>

  <div class="chips" id="chips"></div>

  <div class="note" id="overview"></div>

  <div id="list"></div>

  <div class="note">
    <b>注意</b>：这是江苏省专科（高职）院校全名单，不等于「都能报专转本」。专转本的接收院校是本科院校（见「2026 招生计划」），
    这份名单是给你确认自己学校性质、或者看同城有哪些专科用的。
  </div>

</div>

<div class="foot">
  <div>数据来源：江苏省教育厅公布的普通高等学校名单（专科层次）</div>
</div>

<script src="data/colleges.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var C = window.DATA_COLLEGE;
  var state = { city: '', kw: '' };
  var listEl = document.getElementById('list');

  var cities = [];
  C.forEach(function (x) { if (cities.indexOf(x.city) < 0) cities.push(x.city); });

  var CITIES_ORDER = ['南京市', '无锡市', '徐州市', '常州市', '苏州市', '南通市', '连云港市',
                      '淮安市', '盐城市', '扬州市', '镇江市', '泰州市', '宿迁市'];
  cities.sort(function (a, b) {
    var i = CITIES_ORDER.indexOf(a), j = CITIES_ORDER.indexOf(b);
    return (i < 0 ? 99 : i) - (j < 0 ? 99 : j);
  });

  DB.renderChips(document.getElementById('chips'), cities, state.city, function (c) { state.city = c; apply(); }, '全部城市');

  function natCls(n) {
    if (n.indexOf('民办') >= 0) return 'nat-priv';
    if (n.indexOf('公办') >= 0) return 'nat-pub';
    return 'nat-other';
  }

  function apply() {
    var kw = state.kw.trim().toLowerCase();
    var arr = C.filter(function (x) {
      if (state.city && x.city !== state.city) return false;
      if (kw && (x.name + x.city + x.nature).toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });

    document.getElementById('cnt').textContent = arr.length + ' 所';

    var pub = arr.filter(function (x) { return x.nature.indexOf('公办') >= 0; }).length;
    var priv = arr.filter(function (x) { return x.nature.indexOf('民办') >= 0; }).length;
    document.getElementById('overview').innerHTML =
      '当前 <b>' + arr.length + '</b> 所：公办 <b>' + pub + '</b> 所、民办 <b>' + priv + '</b> 所' +
      (arr.length - pub - priv > 0 ? '、其他办学性质 ' + (arr.length - pub - priv) + ' 所' : '') + '。';

    if (!arr.length) {
      listEl.innerHTML = '<div class="empty">没有匹配的院校</div>';
      return;
    }

    // 按城市分组
    var byCity = {};
    arr.forEach(function (x) {
      if (!byCity[x.city]) byCity[x.city] = [];
      byCity[x.city].push(x);
    });

    listEl.innerHTML = cities.filter(function (c) { return byCity[c]; }).map(function (c) {
      var items = byCity[c];
      return '<div class="city">' +
        '<div class="city-head">' + DB.esc(c) + '<span class="n">' + items.length + ' 所</span></div>' +
        items.map(function (x) {
          return '<div class="sch"><div class="nm">' + DB.esc(x.name) + '</div>' +
            '<div class="nat ' + natCls(x.nature) + '">' + DB.esc(x.nature) + '</div></div>';
        }).join('') +
        '</div>';
    }).join('');
  }

  var t = null;
  document.getElementById('kw').addEventListener('input', function (e) {
    clearTimeout(t);
    var v = e.target.value;
    t = setTimeout(function () { state.kw = v; apply(); }, 160);
  });

  apply();
})();
</script>
</body>
</html>
